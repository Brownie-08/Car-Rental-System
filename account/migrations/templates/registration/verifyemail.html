{% extends 'base.html' %}

{% block title %}Verify Email{% endblock %}

{% block body %}
<div class="container" style="margin-top: 15px;">
    <h1>Verify Your Email</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Submit</button>
    </form>
    {% if form.errors %}
        <div class="error">
            {% for field in form %}
                {% for error in field.errors %}
                    <p>{{ error }}</p>
                {% endfor %}
            {% endfor %}
        </div>
    {% endif %}
</div>
{% endblock %}
